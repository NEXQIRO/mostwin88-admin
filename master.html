<style>
    /* ========================================================
       MostWinn88 Luxury Dark & Gold Design System  (Admin theme)
       ======================================================== */
    :root {
      --bg-base:#0A0A0A; --bg-surface:#151310; --bg-card:#151310; --bg-card-hover:#1D1A14; --bg-inner:#1D1A14;
      --border-color:#B97800; --border-subtle:#2E281C;
      --primary:#F59E0B; --primary-hover:#FFAF1A; --primary-glow:rgba(245,158,11,.35);
      --accent:#F87171; --accent-hover:#EF4444; --accent-glow:rgba(248,113,113,.35);
      --success:#4ADE80; --warning:#F59E0B; --info:#38BDF8;
      --text-main:#F5EFE0; --text-muted:#A89F8A; --text-dim:#736B5E;
      --sidebar-width:260px; --header-height:64px;
      --font-display:'Rajdhani',sans-serif;
      --font-body:'Hind Siliguri','Inter',-apple-system,sans-serif;
      --radius-sm:8px; --radius-md:12px; --radius-lg:14px; --radius-xl:18px;
      --shadow-card:0 4px 18px rgba(0,0,0,.5); --shadow-glow:0 0 20px rgba(245,158,11,.22);
      --c-base:#0A0A0A; --c-deep:#12100E; --c-surface:#151310; --c-inner:#1D1A14; --c-line:#2E281C; --c-gold-line:#B97800;
      --c-text:#F5EFE0; --c-muted:#A89F8A; --c-dim:#736B5E; --c-on-primary:#0A0A0A;
    }
    [data-theme="light"] {
      --bg-base:#F4F1EA; --bg-surface:#FFFFFF; --bg-card:#FFFFFF; --bg-card-hover:#FAF6EC; --bg-inner:#F6F2E8;
      --border-color:#D97706; --border-subtle:#E6DECB;
      --primary:#D97706; --primary-hover:#B45309; --primary-glow:rgba(217,119,6,.25);
      --accent:#DC2626; --accent-hover:#B91C1C; --accent-glow:rgba(220,38,38,.25);
      --success:#15803D; --warning:#B45309; --info:#0369A1;
      --text-main:#1C1917; --text-muted:#57534E; --text-dim:#78716C;
      --shadow-card:0 2px 10px rgba(60,40,10,.10); --shadow-glow:0 0 14px rgba(217,119,6,.15);
      --c-base:#F4F1EA; --c-deep:#EFEBE0; --c-surface:#FFFFFF; --c-inner:#F6F2E8; --c-line:#E6DECB; --c-gold-line:#D97706;
      --c-text:#1C1917; --c-muted:#57534E; --c-dim:#78716C; --c-on-primary:#1C1917;
      color-scheme:light;
    }
    /* master panel er purono variable naam -> admin theme er sathe link (dark/light dutotei kaj korbe) */
    body {
      --bg:var(--bg-base); --card:var(--bg-card); --in:var(--bg-inner); --bd:var(--border-subtle);
      --gold:var(--primary); --bg2:var(--border-color); --tx:var(--text-main); --mu:var(--text-muted);
      --ok:var(--success); --er:var(--accent); --on:var(--c-on-primary);
    }

    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    body {
      background-color:var(--bg-base); color:var(--text-main); font-family:var(--font-body); font-size:14px;
      min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden; line-height:1.5;
    }
    h1,h2,h3,h4,.font-heading,.stat-value,.badge { font-family:var(--font-display); text-transform:uppercase; letter-spacing:.5px; }
    #app { display:none; min-height:100vh; width:100%; }

    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:var(--c-base); }
    ::-webkit-scrollbar-thumb { background:var(--c-line); border-radius:4px; }
    ::-webkit-scrollbar-thumb:hover { background:var(--c-gold-line); }

    /* ---------- Sidebar ---------- */
    .sidebar { width:var(--sidebar-width); background:var(--bg-surface); border-right:1px solid var(--border-subtle);
      display:flex; flex-direction:column; position:fixed; top:0; bottom:0; left:0; z-index:100; transition:transform .3s ease; }
    .brand-header { padding:18px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--border-subtle); background:var(--c-surface); }
    .brand-logo { width:42px; height:42px; border-radius:var(--radius-md); background:#F59E0B; display:flex; align-items:center; justify-content:center;
      box-shadow:0 0 16px var(--primary-glow); flex-shrink:0; overflow:hidden; }
    .brand-logo svg { width:24px; height:24px; fill:var(--c-on-primary); }
    .brand-title { font-size:1.15rem; font-weight:700; color:var(--c-text); line-height:1.2; font-family:var(--font-display); letter-spacing:.5px; }
    .brand-sub { font-size:.72rem; color:var(--primary); font-weight:600; letter-spacing:1px; }
    .nav-list { list-style:none; padding:16px 10px; display:flex; flex-direction:column; gap:5px; flex:1; overflow-y:auto; }
    .nav-item button { width:100%; background:transparent; border:1px solid transparent; border-radius:var(--radius-md); padding:11px 14px;
      color:var(--text-muted); font-family:var(--font-body); font-size:.92rem; font-weight:500; display:flex; align-items:center; gap:12px;
      cursor:pointer; transition:all .2s ease; text-align:left; }
    .nav-item button svg { width:20px; height:20px; flex-shrink:0; fill:currentColor; }
    .nav-item button:hover { background:var(--bg-card-hover); color:var(--text-main); border-color:var(--border-subtle); }
    .nav-item button.on { background:var(--c-inner); border:1px solid var(--border-color); color:var(--primary); font-weight:600; box-shadow:inset 3px 0 0 var(--primary); }
    .nav-badge { margin-left:auto; background:var(--border-color); color:var(--c-on-primary); font-size:.72rem; padding:2px 8px; border-radius:999px; font-family:var(--font-display); font-weight:700; }
    .sidebar-footer { padding:14px 16px; border-top:1px solid var(--border-subtle); background:#100E0C; display:flex; flex-direction:column; gap:10px; }
    [data-theme="light"] .sidebar-footer { background:var(--c-deep); }
    .admin-pill { display:flex; align-items:center; gap:10px; }
    .admin-avatar { width:36px; height:36px; border-radius:10px; background:var(--primary); color:var(--c-on-primary); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.9rem; font-family:var(--font-display); flex-shrink:0; }
    .admin-details { flex:1; overflow:hidden; }
    .admin-name { font-size:.82rem; font-weight:600; color:var(--text-main); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .admin-role { font-size:.68rem; color:var(--primary); font-weight:700; letter-spacing:.8px; }

    /* ---------- Main + Topbar ---------- */
    .main-wrapper { flex:1; margin-left:var(--sidebar-width); display:flex; flex-direction:column; min-width:0; min-height:100vh; background:var(--bg-base); }
    .topbar { height:var(--header-height); background:var(--c-surface); border-bottom:1px solid var(--border-subtle); position:sticky; top:0; z-index:90;
      display:flex; align-items:center; justify-content:space-between; padding:0 20px; gap:10px; backdrop-filter:blur(10px); }
    .topbar-left { display:flex; align-items:center; gap:10px; min-width:0; }
    .topbar-actions { display:flex; align-items:center; gap:10px; margin-left:auto; }
    .mobile-menu-btn { display:none; width:40px; height:40px; border-radius:12px; background:var(--c-surface); border:1px solid var(--c-line); color:var(--c-text); cursor:pointer; place-items:center; padding:0; transition:all .2s; }
    .mobile-menu-btn svg { width:20px; height:20px; fill:currentColor; }
    .mobile-menu-btn:hover { border-color:var(--border-color); color:var(--primary); background:var(--c-surface); }
    .btn-icon { background:var(--c-surface); border:1px solid var(--c-line); color:var(--text-muted); width:38px; height:38px; padding:0; border-radius:12px;
      display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .2s; }
    .btn-icon:hover { color:var(--primary); border-color:var(--border-color); background:var(--c-inner); }
    .btn-icon svg { width:18px; height:18px; fill:currentColor; }
    .theme-toggle-btn svg { width:20px; height:20px; fill:currentColor; }
    .theme-toggle-btn { flex-shrink:0; }
    .bal { border:1px solid var(--c-gold-line); background:var(--c-inner); color:#F59E0B; border-radius:999px; padding:4px 14px; font:700 15px var(--font-display); letter-spacing:.4px; white-space:nowrap; }
    .content-area { padding:20px; flex:1; max-width:1400px; width:100%; margin:0 auto; }

    /* ---------- Stats ---------- */
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; margin-bottom:22px; }
    .stat-card { background:var(--bg-card); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); padding:16px 18px; display:flex; align-items:center; gap:14px; transition:all .2s; }
    .stat-card:hover { border-color:var(--border-color); }
    .stat-icon { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .stat-icon svg { width:22px; height:22px; fill:currentColor; }
    .stat-gold { background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.4); color:var(--primary); }
    .stat-red { background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.4); color:var(--accent); }
    .stat-green { background:rgba(74,222,128,.12); border:1px solid rgba(74,222,128,.4); color:var(--success); }
    .stat-blue { background:rgba(56,189,248,.12); border:1px solid rgba(56,189,248,.4); color:var(--info); }
    .stat-info { flex:1; overflow:hidden; }
    .stat-title { font-size:.78rem; color:var(--text-muted); margin-bottom:2px; font-weight:500; }
    .stat-value { font-size:1.6rem; font-weight:700; color:var(--c-text); line-height:1.1; font-family:var(--font-display); }

    /* ---------- Cards / content (master er dynamic content ei class gulo e render hoy) ---------- */
    .cd { background:var(--c-surface); border:1px solid var(--c-line); border-radius:var(--radius-lg); padding:14px; box-shadow:var(--shadow-card); }
    .cd b { display:block; font:700 22px var(--font-display); color:var(--gold); }
    .cd span { color:var(--mu); font-size:12px; }

    /* ---------- Buttons ---------- */
    button,input,textarea,select { font-family:var(--font-body); font-size:14px; }
    button { border:1px solid var(--border-color); background:var(--c-inner); color:var(--primary); border-radius:var(--radius-md); padding:7px 14px; cursor:pointer; font-weight:600; transition:all .2s; }
    button:hover { background:var(--border-color); color:var(--c-on-primary); }
    button.on, button.p { background:#F59E0B; color:var(--c-on-primary); border-color:transparent; font-weight:700; }
    button.on:hover, button.p:hover { background:#FFAF1A; color:var(--c-on-primary); }
    button.d { background:#F87171; color:var(--c-on-primary); border-color:transparent; font-weight:700; }
    button.d:hover { background:#EF4444; color:#fff; }
    button:disabled { opacity:.4; cursor:not-allowed; }
    .nav-item button.on { background:var(--c-inner); border:1px solid var(--border-color); color:var(--primary); font-weight:600; }
    .nav-item button:hover { background:var(--bg-card-hover); color:var(--text-main); border-color:var(--border-subtle); }
    .nav-item button.on:hover { border-color:var(--border-color); color:var(--primary); }

    /* ---------- Forms ---------- */
    input, textarea, select { background:var(--c-inner); border:1px solid var(--border-subtle); border-radius:var(--radius-md); color:var(--text-main); outline:none; transition:border .2s; }
    input { height:44px; padding:0 14px; width:100%; }
    textarea { width:100%; padding:10px 14px; font-size:13px; }
    select { height:44px; padding:0 14px; cursor:pointer; }
    input:focus, textarea:focus, select:focus { border-color:var(--border-color); box-shadow:0 0 0 2px rgba(245,158,11,.15); }
    input[type=checkbox], input[type=radio] { width:auto; height:auto; }
    #tn { height:38px; max-width:220px; border-color:var(--border-color); color:var(--primary); font-weight:600; padding:0 10px; }
    select option { background:var(--c-surface); color:var(--text-main); }
    .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .row input { flex:1; min-width:140px; }

    /* ---------- Tables ---------- */
    .sc { overflow-x:auto; border-radius:var(--radius-md); }
    table { width:100%; border-collapse:collapse; min-width:640px; text-align:left; font-size:.88rem; }
    th { background:var(--c-inner); color:var(--text-muted); font-family:var(--font-display); font-weight:600; font-size:.78rem; padding:12px 16px; border-bottom:1px solid var(--border-subtle); white-space:nowrap; letter-spacing:.5px; text-align:left; }
    td { padding:12px 16px; border-bottom:1px solid var(--border-subtle); color:var(--text-main); vertical-align:middle; text-align:left; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:var(--c-inner); }
    table td .pl, table th .pl { white-space:nowrap; }

    /* ---------- Badges / pills ---------- */
    .pl { display:inline-block; padding:2px 10px; border-radius:999px; font-size:11px; font-weight:600; border:1px solid #1f5b35; color:var(--ok); background:rgba(74,222,128,.1); }
    .pl.b { border-color:#6b2a2a; color:var(--er); background:rgba(248,113,113,.1); }
    .pl.y { border-color:var(--bg2); color:var(--gold); background:var(--in); }

    /* ---------- Toggle switch ---------- */
    .sw { width:50px; height:26px; padding:0; border-radius:99px; position:relative; background:rgba(248,113,113,.15); border-color:rgba(248,113,113,.5); vertical-align:middle; }
    .sw::after { content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--er); transition:.2s; }
    .sw:hover { background:rgba(248,113,113,.15); }
    .sw.ok { background:rgba(74,222,128,.15); border-color:rgba(74,222,128,.5); }
    .sw.ok:hover { background:rgba(74,222,128,.15); }
    .sw.ok::after { left:26px; background:var(--ok); }

    /* ---------- Login ---------- */
    #login { position:fixed; inset:0; background:var(--c-base); z-index:1500; display:flex; align-items:center; justify-content:center; padding:20px; }
    .login-box { width:100%; max-width:420px; background:var(--c-surface); border:1px solid var(--border-subtle); border-radius:var(--radius-xl); padding:32px 28px; box-shadow:0 20px 50px rgba(0,0,0,.85), var(--shadow-glow); text-align:center; }
    .login-logo { width:60px; height:60px; margin:0 auto 16px; border-radius:var(--radius-lg); background:#F59E0B; display:flex; align-items:center; justify-content:center; box-shadow:0 0 20px var(--primary-glow); }
    .login-logo svg { width:32px; height:32px; fill:var(--c-on-primary); }
    .login-title { font-size:1.5rem; color:var(--c-text); margin-bottom:4px; font-family:var(--font-display); letter-spacing:.5px; }
    .login-sub { color:var(--text-muted); font-size:.82rem; margin-bottom:24px; }
    .login-form { display:flex; flex-direction:column; gap:12px; }
    .login-form button { min-height:44px; }

    /* ---------- Toast ---------- */
    #toast { position:fixed; bottom:24px; right:24px; left:auto; transform:none; background:var(--c-surface); border:1px solid var(--border-subtle); border-left:4px solid var(--primary);
      box-shadow:0 10px 30px rgba(0,0,0,.7); border-radius:var(--radius-md); padding:12px 18px; color:var(--c-text); font-size:.88rem; display:none; z-index:2000; max-width:380px; }

    /* ---------- Responsive (admin er moto) ---------- */
    @media (max-width:900px) {
      .sidebar { transform:translateX(-100%); }
      .sidebar.open { transform:translateX(0); }
      .main-wrapper { margin-left:0; }
      .mobile-menu-btn { display:grid; }
      .content-area { padding:14px; }
      .stats-grid { grid-template-columns:1fr 1fr; }
      .topbar { padding:0 12px; }
    }
    @media (max-width:500px) { .stats-grid { grid-template-columns:1fr; } }

    /* ---------- Light theme extras ---------- */
    body[data-theme="light"] .sidebar { box-shadow:2px 0 12px rgba(60,40,10,.08); }
    body[data-theme="light"] .topbar { backdrop-filter:none; }
    body[data-theme="light"] .bal, body[data-theme="light"] .gold { color:#B45309; }
    body[data-theme="light"] ::-webkit-scrollbar-thumb { background:#D8CCAE; }
    body[data-theme="light"] #toast { box-shadow:0 6px 20px rgba(60,40,10,.18); }

    /* ---------- Classic flat look (admin er moto: no shadow / glow / gradient) ---------- */
    *, *::before, *::after { box-shadow:none !important; text-shadow:none !important; }
    :is(button,.btn-icon,.stat-card,.cd,.nav-item):hover { transform:none !important; }
    [style*="gradient"]:not(.toast) { background-image:none !important; background-color:var(--bg-card) !important; }
    .stat-card, .cd { border-radius:10px; }
    .nav-item button.on { box-shadow:inset 3px 0 0 var(--primary) !important; }
    .login-box { box-shadow:0 20px 50px rgba(0,0,0,.85) !important; }
    .m-chat-fab { position:fixed; right:20px; bottom:20px; width:56px; height:56px; border-radius:50%; background:var(--primary,#F59E0B); color:#000; border:2px solid rgba(255,255,255,.18); font-size:24px; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:1100; box-shadow:0 8px 24px rgba(0,0,0,.45) !important; transition:transform .15s; }
    .m-chat-fab:hover { transform:scale(1.06) !important; }
    .m-fab-badge { position:absolute; top:-4px; right:-4px; min-width:20px; height:20px; padding:0 5px; border-radius:10px; background:#EF4444; color:#fff; font-size:11px; font-weight:800; display:none; align-items:center; justify-content:center; border:2px solid var(--bg,#0A0A0A); }
    .m-modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:1600; display:none; align-items:center; justify-content:center; padding:16px; }
    .m-modal-bg.open { display:flex; }
    .m-modal-card { width:100%; max-width:480px; background:var(--c-surface); border:1px solid var(--border-subtle); border-radius:14px; padding:20px; }

function openChatWithAdmin(uid) {

}

function attachActiveAdminChat(uid) {
  if (ACTIVE_CHAT_UNSUB) {
    try { ACTIVE_CHAT_UNSUB.off(); } catch (e) {}
    ACTIVE_CHAT_UNSUB = null;
  }
  if (!uid) return;
  // Mark read for master
  db.ref('master_admin_chats/' + uid + '/meta/unreadForMaster').set(false).catch(() => {});
  
  ACTIVE_CHAT_UNSUB = db.ref('master_admin_chats/' + uid + '/messages').limitToLast(120);
  ACTIVE_CHAT_UNSUB.on('value', snap => {
    const val = snap.val() || {};
    ACTIVE_CHAT_MSGS = Object.entries(val).map(([id, d]) => ({ id, ...d })).sort((a,b) => (a.timestamp||0) - (b.timestamp||0));
    if (cur === 'chat' && SEL_CHAT_ADMIN === uid) {
      draw();
      setTimeout(() => {
        const b = $('master-chat-body');
        if (b) b.scrollTop = b.scrollHeight;
      }, 50);
    }
  });
}

async function sendMasterChatReply(e) {
  if (e) e.preventDefault();
  const inp = $('master-chat-reply-input');
  if (!inp) return;
  const text = inp.value.trim();
  if (!text || !SEL_CHAT_ADMIN) return;

  const uid = SEL_CHAT_ADMIN;
  try {
    await db.ref('master_admin_chats/' + uid + '/messages').push({
      sender: 'MASTER',
      senderName: 'Master Administrator',
      senderEmail: (auth.currentUser && auth.currentUser.email) || 'Master',
      text: text,
      timestamp: TS,
      read: false
    });
    await db.ref('master_admin_chats/' + uid + '/meta').update({
      lastMessage: text,
      lastTimestamp: TS,
      lastSender: 'MASTER',
      unreadForMaster: false,
      unreadForAdmin: true
    });
    inp.value = '';
    inp.focus();
  } catch (err) {
    toast('মেসেজ পাঠানো ব্যর্থ: ' + err.message);
  }
}

function initMasterChatGlobalListener() {
  db.ref('master_admin_chats').on('value', snap => {
    const val = snap.val() || {};
    let totalUnread = 0;
    CHAT_METAS = {};
    Object.entries(val).forEach(([uid, data]) => {
      const meta = data.meta || {};
      CHAT_METAS[uid] = meta;
      if (meta.unreadForMaster === true) totalUnread++;
    });
    const unreadEl = $('nav-chat-unread');
    const unreadTxt = totalUnread > 9 ? '9+' : String(totalUnread);
    if (unreadEl) {
      unreadEl.textContent = unreadTxt;
      unreadEl.style.display = totalUnread > 0 ? 'inline-block' : 'none';
    }
    const fabBadge = $('m-fab-chat-badge');
    if (fabBadge) {
      fabBadge.textContent = unreadTxt;
      fabBadge.style.display = totalUnread > 0 ? 'flex' : 'none';
    }
    if (cur === 'chat') draw();
  });
}

function getPlayerBetStats(uid){
 const txMap=Object.assign({},GTX);
 if(GTXFULL[uid])Object.assign(txMap,GTXFULL[uid]);
 const all=Object.values(txMap).filter(t=>t&&t.uid===uid);
 let betCount=0,totalBet=0,totalWin=0,byGame={},recent=[];
 all.forEach(t=>{
  const tp=String(t.type||'').toLowerCase();
  const gm=t.gameName||t.game||'Game';
  const amt=Math.abs(parseFloat(t.amount)||0);
  const winVal=parseFloat(t.win!==undefined?t.win:(t.payout!==undefined?t.payout:(tp.includes('win')||tp.includes('cashout')?amt:0)))||0;
  if(!byGame[gm])byGame[gm]={bets:0,betAmt:0,winAmt:0};
  if(tp==='bet'||tp==='game_bet'||tp.includes('bet')){
   betCount++;totalBet+=amt;byGame[gm].bets++;byGame[gm].betAmt+=amt;
  }else if(tp==='cashout'||tp==='win'||tp==='game_win'||tp.includes('win')||tp.includes('cashout')){
   totalWin+=winVal;byGame[gm].winAmt+=winVal;
  }
  recent.push({gm,tp,amt,winVal,bal:t.balance,time:t.time||t.timestamp||0,ip:t.ip||'',device:t.device||''});
 });
 recent.sort((a,b)=>(+b.time||0)-(+a.time||0));
 return {betCount,totalBet,totalWin,netPL:totalWin-totalBet,byGame,recent:recent.slice(0,40)};
}

function parseTiers(txt){
 if(!txt)return [];
 const lines=txt.split('\n');
 const out=[];
 for(let l of lines){
  const parts=l.split(',').map(s=>s.trim());
  if(parts.length>=3){
   const min=parseFloat(parts[0]),bp=parseFloat(parts[1]),to=parseFloat(parts[2]);
   if(!isNaN(min)&&!isNaN(bp)&&!isNaN(to)&&min>0){
    out.push({minDeposit:min,bonusPercent:bp,turnoverMultiplier:to});
   }
  }
 }
 out.sort((a,b)=>a.minDeposit-b.minDeposit);
 return out;
}
function formatTiers(tiers){
 if(!Array.isArray(tiers)||!tiers.length)return '300, 3, 1\n500, 10, 3';
 return tiers.map(t=>`${t.minDeposit}, ${t.bonusPercent}, ${t.turnoverMultiplier}`).join('\n');
}

async function clearAdminTx(){
 const P=['balanceLedger','balanceRequests','admin_wallet_ledger','admin_fund_requests'];
 let sn;try{sn=await Promise.all(P.map(x=>db.ref(x).once('value')))}catch(e){toast('ডেটা পড়া যায়নি: '+e.message);return}
 const data={},ups={};let n=0,pend=0;
 P.forEach((x,i)=>{const v=sn[i].val()||{};data[x]=v;Object.keys(v).forEach(k=>{ups[x+'/'+k]=null;n++;if(x==='balanceRequests'&&v[k]&&v[k].status==='pending')pend++})});
 if(!n){toast('মোছার মতো কোনো লেনদেন নেই');return}
 if(!confirm('User Admin-দের সব লেনদেনের ইতিহাস ('+n+' টি রেকর্ড: লেজার ও ব্যালেন্স রিকোয়েস্ট) মুছে যাবে।'+(pend?'\n⚠ এর মধ্যে '+pend+' টি রিকোয়েস্ট এখনো পেন্ডিং।':'')+'\nঅ্যাডমিনদের বর্তমান ব্যালেন্স ও প্লেয়ারদের লেনদেন বদলাবে না।\nএই কাজ ফেরানো যাবে না। এগোবেন?'))return;
 if(!await reauth())return;
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));a.download='admin-transactions-backup-'+Date.now()+'.json';document.body.appendChild(a);a.click();a.remove()}catch(e){if(!confirm('ব্যাকআপ ডাউনলোড হয়নি। ব্যাকআপ ছাড়াই মুছবেন?'))return}
 try{const ks=Object.keys(ups);for(let i=0;i<ks.length;i+=400){const c={};ks.slice(i,i+400).forEach(k=>c[k]=null);await db.ref().update(c)}
  try{await db.ref('adminAuditLogs').push({admin:auth.currentUser.email,action:'CLEAR_ADMIN_TRANSACTIONS',target:'all',details:n+' records deleted',timestamp:Date.now()})}catch(e){}
  toast('সব লেনদেন মুছে ফেলা হয়েছে ✅ ('+n+' টি)')}
 catch(e){toast('ব্যর্থ: '+e.message)}}

function promoDraw(){
 const f=PF,bt=f.bt||'percent',act=f.act!==false;
 const rows=Object.entries(PROMO).sort((a,b)=>(+b[1].createdAt||0)-(+a[1].createdAt||0)).map(([k,p])=>`<tr><td><b>${esc(p.name)}</b></td><td>${fmt(p.minDeposit)} – ${fmt(p.maxDeposit)}</td><td>${p.bonusType==='fixed'?fmt(p.bonusValue):esc(p.bonusValue)+'%'}</td><td>${esc(p.turnoverMultiplier)}x</td><td>${pDt(p.startAt)}<br>${pDt(p.endAt)}</td><td>${p.adminCanToggle?'✅ Enable/Disable অনুমতি আছে':'🔒 শুধু Master'}</td><td><button class="${p.active?'p':'d'}" onclick="pToggle('${k}')">${p.active?'Active':'Inactive'}</button></td><td><button onclick="pEdit('${k}')">এডিট</button> <button class="d" onclick="pDel('${k}')">ডিলিট</button></td></tr>`).join('')||'<tr><td colspan="8">কোনো অফার নেই</td></tr>';
 $('v').innerHTML=`<div class="cd" style="margin-bottom:10px"><b>🎁 ${PEDIT?'অফার এডিট করুন':'নতুন ডিপোজিট অফার'}</b><span>বোনাস ও টার্নওভার সার্ভার নিজে যোগ করবে। User Admin মূল অফার এডিট/ডিলিট করতে পারবে না।</span></div>

async function pSave(){
 const f=PF,n=(f.name||'').trim(),mn=+f.min,mx=+f.max,bv=+f.bv,tm=+f.tm,bt=f.bt==='fixed'?'fixed':'percent';
 if(!n||!(mn>=0)||!(mx>0&&mx>=mn)||!(bv>0)||!(tm>=0)||(bt==='percent'&&bv>100))return toast('তথ্য সঠিক দিন: নাম, ন্যূনতম ≤ সর্বোচ্চ, বোনাস > 0 (শতাংশ হলে ≤ 100), টার্নওভার ≥ 0');
 const s=f.start?new Date(f.start).getTime():0,e=f.end?new Date(f.end).getTime():0;
 if(s&&e&&e<=s)return toast('শেষ তারিখ শুরুর পরে হতে হবে');
 const id=PEDIT||db.ref('depositPromotions').push().key;
 const o={name:n,minDeposit:mn,maxDeposit:mx,bonusType:bt,bonusValue:bv,turnoverMultiplier:tm,active:f.act!==false,startAt:s,endAt:e,adminCanToggle:!!f.tg,updatedAt:TS};
 if(!PEDIT)o.createdAt=TS;
 try{await db.ref('depositPromotions/'+id).update(o);pLog(PEDIT?'PROMO_UPDATE':'PROMO_CREATE',id,n);PF={};PEDIT='';toast('অফার সেভ হয়েছে ✅');draw()}catch(er){toast('ব্যর্থ: '+er.message)}}
function pEdit(k){const p=PROMO[k];if(!p)return;PEDIT=k;PF={name:p.name,min:p.minDeposit,max:p.maxDeposit,bt:p.bonusType,bv:p.bonusValue,tm:p.turnoverMultiplier,start:pLoc(p.startAt),end:pLoc(p.endAt),act:p.active,tg:p.adminCanToggle};draw();scrollTo(0,0)}
function pCancel(){PF={};PEDIT='';draw()}
async function pToggle(k){const p=PROMO[k];if(!p)return;try{await db.ref('depositPromotions/'+k+'/active').set(!p.active);pLog('PROMO_TOGGLE',k,(!p.active)?'ON':'OFF')}catch(e){toast('ব্যর্থ: '+e.message)}}
async function pDel(k){const p=PROMO[k];if(!p||!confirm('"'+p.name+'" অফারটি ডিলিট করবেন? (আগে দেওয়া বোনাস/টার্নওভার অপরিবর্তিত থাকবে)'))return;try{await db.ref('depositPromotions/'+k).remove();pLog('PROMO_DELETE',k,p.name);toast('অফার ডিলিট হয়েছে')}catch(e){toast('ব্যর্থ: '+e.message)}}

  var MOON='<svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>',SUN='<svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 100 10 5 5 0 000-10zM2 13h2a1 1 0 000-2H2a1 1 0 000 2zm18 0h2a1 1 0 000-2h-2a1 1 0 000 2zM11 2v2a1 1 0 002 0V2a1 1 0 00-2 0zm0 18v2a1 1 0 002 0v-2a1 1 0 00-2 0zM5.99 4.58a1 1 0 00-1.41 1.41l1.06 1.06a1 1 0 001.41-1.41L5.99 4.58zm12.37 12.37a1 1 0 00-1.41 1.41l1.06 1.06a1 1 0 001.41-1.41l-1.06-1.06zm1.06-10.96a1 1 0 00-1.41-1.41l-1.06 1.06a1 1 0 001.41 1.41l1.06-1.06zM7.05 18.36a1 1 0 00-1.41-1.41l-1.06 1.06a1 1 0 001.41 1.41l1.06-1.06z"/></svg>';
  window.applyTheme=function(t){
    document.body.setAttribute('data-theme',t);
    try{localStorage.setItem('np_admin_theme',t)}catch(e){}
    var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='light'?'#F4F1EA':'#0A0A0A');
    document.querySelectorAll('.theme-toggle-btn').forEach(function(b){b.innerHTML=t==='light'?SUN:MOON;b.title=t==='light'?'ডার্ক থিমে যান':'লাইট থিমে যান'});
  };
  window.cycleTheme=function(){applyTheme((document.body.getAttribute('data-theme')||'dark')==='dark'?'light':'dark')};
  window.toggleSidebar=function(){document.getElementById('sidebar').classList.toggle('open')};
  applyTheme(document.body.getAttribute('data-theme')||'dark');
  document.querySelectorAll('.nav-item button').forEach(function(b){b.addEventListener('click',function(){document.getElementById('sidebar').classList.remove('open')})});
  var _d=draw;
  draw=function(){
    _d();
    try{
      var u=auth&&auth.currentUser,em=(u&&u.email)||'';
      document.getElementById('sidebar-email').textContent=em;
      document.getElementById('sidebar-avatar').textContent=(em.charAt(0)||'M').toUpperCase();
      document.getElementById('nav-pending').textContent=document.getElementById('s4').textContent;
    }catch(e){}
  };
})();
</script>
<script>
/* ===== নোটিফিকেশন + সাউন্ড (নতুন ব্যালেন্স রিকোয়েস্ট এলে) ===== */
(function(){
  var soundOn=true,read=new Set(),seen=new Set(),seenTid=null,t0=0,swReg=null,ac=null;
  var hasNotif=('Notification' in window);
  try{soundOn=localStorage.getItem('masterSoundOn')!=='false';read=new Set(JSON.parse(localStorage.getItem('master_read_notif_ids')||'[]'))}catch(e){}
  function $$(i){return document.getElementById(i)}
  function getAC(){try{if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C()}if(ac&&ac.state==='suspended')ac.resume().catch(function(){})}catch(e){}return ac}
  ['click','touchstart','keydown'].forEach(function(ev){window.addEventListener(ev,getAC,{once:true,passive:true})});
  function beep(){
    if(!soundOn)return;
    try{var c=getAC();if(!c)return;var now=c.currentTime;
      [523.25,659.25,783.99].forEach(function(f,i){var o=c.createOscillator(),g=c.createGain();
        o.type='sine';o.frequency.setValueAtTime(f,now+i*.12);
        g.gain.setValueAtTime(0,now+i*.12);g.gain.linearRampToValueAtTime(.35,now+i*.12+.02);g.gain.exponentialRampToValueAtTime(.001,now+i*.12+.3);
        o.connect(g);g.connect(c.destination);o.start(now+i*.12);o.stop(now+i*.12+.32)})}catch(e){}
  }
  function updSound(){var ic=$$('snd-ic'),lb=$$('snd-lb'),b=$$('btn-sound');if(!ic)return;
    ic.textContent=soundOn?'🔊':'🔇';lb.textContent=soundOn?'সাউন্ড অন':'সাউন্ড অফ';b.className=soundOn?'':'off'}
  window.toggleMasterSound=function(){soundOn=!soundOn;try{localStorage.setItem('masterSoundOn',soundOn?'true':'false')}catch(e){}updSound();if(soundOn){beep();toast('🔊 সাউন্ড নোটিফিকেশন চালু')}else toast('🔇 সাউন্ড নোটিফিকেশন বন্ধ')};
  updSound();

  if('serviceWorker' in navigator){
    navigator.serviceWorker.ready.then(function(r){swReg=r}).catch(function(){});
    navigator.serviceWorker.addEventListener('message',function(e){if(e.data&&e.data.view==='reqs'){try{tab('reqs')}catch(x){}}});
  }
  function showNotif(title,body,tag){
    var o={body:body,icon:'./master-icon-192.png',badge:'./master-icon-192.png',tag:tag,renotify:true,requireInteraction:true,vibrate:[300,120,300,120,300],data:{view:'reqs'}};
    if(swReg&&swReg.showNotification)swReg.showNotification(title,o);else{try{new Notification(title,o)}catch(e){}}
  }
  window.enableNotifications=async function(){
    if(!hasNotif){toast('এই ব্রাউজারে নোটিফিকেশন সাপোর্ট নেই');return}
    try{var r=await Notification.requestPermission();
      if(r==='granted'){showNotif('✅ নোটিফিকেশন চালু হয়েছে','নতুন ব্যালেন্স রিকোয়েস্ট এলে এভাবে জানানো হবে।','master-test')}
      else toast('নোটিফিকেশন Allow করা হয়নি')}catch(e){}
    drawerNote();
  };
  function drawerNote(){
    var b=$$('btn-enable-notif'),n=$$('nd-note');if(!b)return;
    var p=hasNotif?Notification.permission:'unsupported';
    if(p==='granted'){b.style.display='none';n.textContent='নোটিফিকেশন চালু আছে (অ্যাপ/ব্রাউজার খোলা থাকলে ব্যাকগ্রাউন্ডেও জানাবে)।'}
    else if(p==='denied'){b.style.display='none';n.textContent='নোটিফিকেশন বন্ধ করা আছে। ফোন/ব্রাউজার সেটিংস থেকে এই সাইটের নোটিফিকেশন Allow করুন।'}
    else if(p==='unsupported'){b.style.display='none';n.textContent='এই ব্রাউজারে নোটিফিকেশন সাপোর্ট নেই।'}
    else{b.style.display='block';n.textContent='iPhone এ আগে "Add to Home Screen" করে অ্যাপ খুলুন।'}
  }
  function pend(){return Object.entries(REQ).filter(function(x){return x[1].status==='pending'}).reverse()}
  function saveRead(){try{localStorage.setItem('master_read_notif_ids',JSON.stringify(Array.from(read).slice(-500)))}catch(e){}}
  function badge(){var n=pend().filter(function(x){return !read.has(x[0])}).length,b=$$('notif-badge');if(!b)return;
    b.style.display=n?'block':'none';b.textContent=n>99?'99+':n}
  function renderDrawer(){
    var L=$$('nd-list');if(!L)return;var P=pend();
    L.innerHTML=P.length?P.map(function(x){var k=x[0],r=x[1];
      return '<div class="nd-item" onclick="goReqs(\''+k+'\')"><span class="nd-dot'+(read.has(k)?' rd':'')+'"></span><div class="nd-main"><b>'+esc(r.email||'অ্যাডমিন')+'</b><span>'+esc(r.note||'ব্যালেন্স রিকোয়েস্ট')+(r.createdAt?' • '+new Date(r.createdAt).toLocaleString('bn-BD'):'')+'</span></div><div class="nd-amt">'+fmt(r.amount)+'</div></div>'}).join('')
      :'<div class="nd-empty">কোনো পেন্ডিং রিকোয়েস্ট নেই ✅</div>';
    drawerNote();
  }
  window.toggleNotifDrawer=function(){var d=$$('notif-drawer');d.classList.toggle('open');if(d.classList.contains('open'))renderDrawer()};
  window.goReqs=function(k){read.add(k);saveRead();badge();$$('notif-drawer').classList.remove('open');tab('reqs')};
  window.markAllNotifRead=function(){pend().forEach(function(x){read.add(x[0])});saveRead();badge();renderDrawer()};
  document.addEventListener('click',function(e){var d=$$('notif-drawer');if(d&&d.classList.contains('open')&&!d.contains(e.target)&&!e.target.closest('#btn-notif-bell'))d.classList.remove('open')});

  function check(){
    if(!started)return;
    if(seenTid!==TID){seenTid=TID;seen=new Set();t0=Date.now()}
    var fresh=[];
    pend().forEach(function(x){if(!seen.has(x[0])){seen.add(x[0]);if(Date.now()-t0>2500)fresh.push(x)}});
    if(fresh.length){
      beep();
      fresh.forEach(function(x){var r=x[1];toast('🔔 নতুন ব্যালেন্স রিকোয়েস্ট: '+(r.email||'অ্যাডমিন')+' — '+fmt(r.amount));
        if(hasNotif&&Notification.permission==='granted'&&!(document.visibilityState==='visible'&&document.hasFocus()))
          showNotif('💰 নতুন ব্যালেন্স রিকোয়েস্ট',(r.email||'অ্যাডমিন')+' — '+fmt(r.amount),'req-'+x[0])});
    }
  }
  var _d3=draw;
  draw=function(){_d3();try{check();badge();if($$('notif-drawer').classList.contains('open'))renderDrawer()}catch(e){}};
  drawerNote();
})();
</script>
<script>if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',function(){navigator.serviceWorker.register('./master-sw.js').catch(function(){})})}</script>
<script>
(function(){
  function fitLogo(wrapId, tagId){
    const w=document.getElementById(wrapId), t=document.getElementById(tagId);
    if(!w||!t) return;
    const lm=w.querySelector('.lm'); if(!lm) return;
    const lw=lm.getBoundingClientRect().width;
    if(!lw) return;
    t.style.letterSpacing='0px';
    const base=t.getBoundingClientRect().width;
    const n=Math.max(1,t.textContent.trim().length-1);
    const sp=Math.max(0,(lw-base)/n);
    t.style.letterSpacing=sp.toFixed(2)+'px';
  }
  function fitAll(){fitLogo('mLoginLogoWrap','mLoginTag');fitLogo('mBrandLogoWrap','mBrandTag')}
  window.addEventListener('load',()=>setTimeout(fitAll,60));
  window.addEventListener('resize',fitAll);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitAll);
  setTimeout(fitAll,200);
})();
</script>

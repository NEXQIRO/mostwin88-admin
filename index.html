<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090B">
<title>MOSTWIN88 — All Panels</title>
<link rel="icon" type="image/png" href="./icon-192.png?v=3">
<script>
try {
  var sp = new URLSearchParams(location.search);
  if (sp.has('ref') || sp.has('r') || sp.has('invite') || sp.has('admin')) {
    location.replace('./user/' + location.search + location.hash);
  }
  if ('serviceWorker' in navigator) {
    var rootScope = location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, '');
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (r) {
        if (r && r.scope === rootScope) r.unregister().catch(function () {});
      });
    }).catch(function () {});
  }
} catch (e) {}
</script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:#09090B;color:#F8FAFC;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .wrap{width:100%;max-width:720px}
  .hd{text-align:center;margin-bottom:24px}
  .brand{font-size:28px;font-weight:900;letter-spacing:1.5px;color:#FACC15}
  .brand span{color:#FFFFFF}
  .sub{margin-top:6px;font-size:13.5px;color:#A1A1AA}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:12px;background:#111115;border:1px solid #27272A;color:#F8FAFC;text-decoration:none;transition:border-color .15s,background .15s}
  .card:hover{border-color:#EAB308;background:#16161B}
  .card img{width:44px;height:44px;border-radius:10px;border:1px solid rgba(250,204,21,.35);object-fit:cover;flex:none}
  .meta b{display:block;font-size:15px;font-weight:700;color:#FACC15}
  .meta small{display:block;font-size:12px;color:#A1A1AA;margin-top:3px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="hd">
      <div class="brand">MOST<span>WIN88</span></div>
      <div class="sub">প্রতিটি প্যানেল আলাদা ফোল্ডারে ও ডার্ক মোডে — আলাদা অ্যাপ হিসেবে ইনস্টল করা যাবে</div>
    </div>
    <div class="grid">
      <a class="card" href="./user/">
        <img src="./icon-192.png?v=3" alt="User App">
        <div class="meta"><b>User App</b><small>/user/ • Player Portal</small></div>
      </a>
      <a class="card" href="./admin/">
        <img src="./admin-icon-192.png" alt="User Admin">
        <div class="meta"><b>User Admin</b><small>/admin/ • Admin Console</small></div>
      </a>
      <a class="card" href="./master/">
        <img src="./master-icon-192.png" alt="Master Admin">
        <div class="meta"><b>Master Admin</b><small>/master/ • Master Console</small></div>
      </a>
      <a class="card" href="./agent/">
        <img src="./agent-icon-192.png" alt="Agent App">
        <div class="meta"><b>Agent Panel</b><small>/agent/ • Agent App</small></div>
      </a>
      <a class="card" href="./affiliate/">
        <img src="./affiliate-icon-192.png" alt="Affiliate App">
        <div class="meta"><b>Affiliate Panel</b><small>/affiliate/ • Partner App</small></div>
      </a>
    </div>
  </div>
</body>
</html>
